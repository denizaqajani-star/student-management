<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğrenci Yönetim Sistemi</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="symbol" aria-hidden="true">🎓</div>
    <p class="eyebrow">JAVASCRIPT ÖDEVİ</p>
    <h1>Öğrenci Yönetim Sistemi</h1>
    <p class="description">Öğrenci ekleyin, listeleyin veya silin. İşlemler JavaScript prompt ve alert pencereleriyle yapılır.</p>
    <div class="features">
      <span>Öğrenci Ekle</span><span>Öğrencileri Listele</span>
      <span>Öğrenci Sil</span><span>Çıkış</span>
    </div>
    <button id="startButton" type="button">Uygulamayı Başlat →</button>
    <p class="hint">Menüyü açmak için butona tıklayın.</p>
  </main>
</body>
</html>
